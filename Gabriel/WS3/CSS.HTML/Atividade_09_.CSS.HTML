<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Form</title>
  <link rel="stylesheet" href="style.css">
   <style type="text/css">@import url("CSS/09.CSS");</style>
</head>
<body>
<div class="container">

  <div class="form-box">

    <div class="form-header">
      <h2>EVENT REGISTRATION FORM</h2>
    </div>

    <div class="form-body">

      
      <div class="form-group">
        <label>Name</label>
        <div class="row">
          <input type="text" placeholder="First Name">
          <input type="text" placeholder="Last Name">
        </div>
      </div>

      <div class="form-group">
        <label>Company</label>
        <input type="text">
      </div>

      
      <div class="form-group">
        <label>Email</label>
        <input type="email">
      </div>

      
      <div class="form-group">
        <label>Phone</label>
        <div class="row">
          <input type="text" placeholder="Area Code">
          <input type="text" placeholder="Phone Number">
        </div>
      </div>

      
      <div class="form-group">
        <label>Subject</label>
        <select>
          <option>Choose option</option>
        </select>
      </div>

      
      <div class="form-group">
        <label>Are you an existing customer?</label>
        <div class="radio-group">
          <label><input type="radio" name="cust"> Yes</label>
          <label><input type="radio" name="cust"> No</label>
        </div>
      </div>

      
      <div class="form-group">
        <label></label>
        <button class="btn">REGISTER</button>
      </div>

    </div>

  </div>

</div>

</body>
</html>
